          echo "PYTHONPATH=$VLLM_SOURCE:$PWD/src" >> "$GITHUB_ENV"
          python -m pip install --only-binary :all: --require-hashes --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r .github/requirements-linux.txt
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; assert torch.version.cuda is None'
      - name: Check result classifier
        run: python -B -m unittest discover -s ci -p 'test_*.py' -v

name: CPU correctness
on: [push, pull_request]
permissions:
  contents: read
env:
  VLLM_TARGET_DEVICE: cpu
  VLLM_NO_USAGE_STATS: '1'
  DO_NOT_TRACK: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
jobs:
  normal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve pinned upstream source and CPU environment
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import platform; assert platform.machine() == "x86_64"; assert tuple(map(int, platform.libc_ver()[1].split("."))) >= (2, 39)'
          VLLM_SOURCE="$RUNNER_TEMP/vllm-source"
          git init "$VLLM_SOURCE"
          git -C "$VLLM_SOURCE" remote add origin https://github.com/vllm-project/vllm.git
          git -C "$VLLM_SOURCE" fetch --depth 1 origin 5df63a7203cdb9328d824a27b682e77c7b9928be
          git -C "$VLLM_SOURCE" checkout --detach FETCH_HEAD
          test "$(git -C "$VLLM_SOURCE" rev-parse HEAD)" = 5df63a7203cdb9328d824a27b682e77c7b9928be
          echo "VLLM_SOURCE=$VLLM_SOURCE" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$VLLM_SOURCE:$PWD/src" >> "$GITHUB_ENV"
          python -m pip install --only-binary :all: --require-hashes --index-url https://pypi.org/simple --extra-index-url https://download.pytorch.org/whl/cpu -r .github/requirements-linux.txt
          python -c 'import torch; assert torch.__version__ == "2.13.0+cpu"; assert torch.version.cuda is None'
      - name: Check result classifier
        run: python -B -m unittest discover -s ci -p 'test_*.py' -v
      - name: Run normal
        run: python -B ci/run_suite.py normal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: cpu-normal
          path: ci-results/
          if-no-files-found: error
          retention-days: 14
  always-miss:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
